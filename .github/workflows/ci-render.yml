# ============================================================
# 🚀 CI - ASSISTANT SERVICE
# ============================================================
#
# CI validates the same Python runtime used by the Docker image.
# Production Dockerfile uses Python 3.11.
#
# ============================================================

name: 🚀 CI - Backend Assistant Service Render

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: 🧪 Assistant Service CI
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📚 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          echo "Dependencies installed successfully"

      - name: 📁 Verify Project Structure
        run: |
          test -f requirements.txt
          test -f Dockerfile
          test -f run.py
          test -f wsgi.py
          echo "Required project files found"

      - name: 🔍 Validate Python Syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          excluded = {".git", ".venv", "venv", "__pycache__"}
          files = [
              path for path in Path(".").rglob("*.py")
              if not any(part in excluded for part in path.parts)
          ]
          if not files:
              raise SystemExit("No Python files found")

          errors = []
          for file in files:
              try:
                  ast.parse(file.read_text(encoding="utf-8"))
              except (SyntaxError, UnicodeError, OSError) as exc:
                  errors.append(f"{file}: {exc}")

          if errors:
              raise SystemExit("\n".join(errors))
          print(f"Validated {len(files)} Python files")
          PY

      - name: 🧪 Run Unit Tests
        run: python -m unittest discover -s tests -v

      - name: 📧 CI Validation Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI PASSED | Assistant Service | ${{ github.ref_name }}"
          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}
          from: Assistant Service <${{ secrets.MAIL_USERNAME }}>
          body: |
            ASSISTANT SERVICE CI VALIDATION PASSED
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
            Ref: ${{ github.ref }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Checks: Python 3.11 dependency installation, required files, syntax, and unit tests.
            This is not a Docker release or deployment confirmation.

      - name: 📧 CI Validation Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI FAILED | Assistant Service | ${{ github.ref_name }}"
          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}
          from: Assistant Service <${{ secrets.MAIL_USERNAME }}>
          body: |
            ASSISTANT SERVICE CI VALIDATION FAILED
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
            Ref: ${{ github.ref }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Inspect the failed validation step in GitHub Actions.
