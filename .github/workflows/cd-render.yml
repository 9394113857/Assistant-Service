# ============================================================
# 🚀 CD - ASSISTANT SERVICE RENDER
# ============================================================
#
# Repository:
# 9394113857/Assistant-Service
#
# Application:
# https://assistant-service-g24j.onrender.com/
#
# DEPLOYMENT STRATEGY
#
# 1. AUTOMATIC VERSION-TAG DEPLOYMENT
#    - A v* Git tag starts the CI workflow.
#    - CD listens for completion of the complete CI workflow.
#    - CI validation MUST succeed.
#    - The Docker Build and Push job MUST also succeed.
#    - Missing, skipped, cancelled, or failed Docker jobs are
#      never accepted as a successful release.
#    - CD verifies the CI and Docker job conclusions through the
#      GitHub Actions jobs API before calling the Render hook.
#    - The release tag must match the CI run commit and current
#      main HEAD, preserving the existing release safety check.
#    - CI publishes both the immutable version tag and the moving
#      :latest Docker tag. Configure the Render image URL to use
#      :latest so the deploy hook pulls the newly released image.
#
# 2. MANUAL DEPLOYMENT
#    - Run this workflow from the Actions tab.
#    - Deploys the latest main branch commit.
#
# 3. SCHEDULED DEPLOYMENT
#    - Daily at 2:00 AM IST (20:30 UTC previous day).
#    - Deploys the latest main branch commit.
#
# IMPORTANT:
#    - A normal branch push, pull request, or non-version tag
#      never triggers automatic CD.
#    - A successful CI validation alone is not a release.
#    - Automatic CD is allowed only after BOTH required jobs
#      (CI validation and Docker Build and Push) succeed.
#    - Manual and scheduled deployments remain independent of
#      the CI/Docker release gate.
#    - No email actions or email secrets are used in this file.
#    - This Render service is image-backed. The deploy hook
#      redeploys the image reference configured in Render; it
#      does not select a Docker tag by itself. The CI workflow
#      updates the Docker :latest tag only after the versioned
#      image is successfully pushed. Configure Render to use
#      <DOCKERHUB_USERNAME>/assistant-service:latest.
#
# REQUIRED GITHUB SECRET:
#    RENDER_DEPLOY_HOOK
#
# CI workflow uses its own Docker Hub secrets:
#    DOCKERHUB_USERNAME
#    DOCKERHUB_TOKEN
#
# ============================================================

name: 🚀 CD - Backend Assistant Service Render

run-name: 🚀 Deploy Assistant Service | ${{ github.event_name }} | ${{ github.event.workflow_run.head_branch || github.ref_name }} | ${{ github.actor }}

# ============================================================
# WORKFLOW TRIGGERS
# ============================================================

on:
  # Automatic CD is initiated only by completion of the CI
  # workflow. The deployment job below checks for a v* tag
  # and verifies that the Docker Build and Push job succeeded.
  workflow_run:
    workflows:
      - "🚀 CI - Backend Assistant Service Render"
    types:
      - completed

  # Daily deployment at 2:00 AM IST.
  # 2:00 AM IST = 20:30 UTC on the previous day.
  schedule:
    - cron: "30 20 * * *"

  # Manual deployment from the GitHub Actions tab.
  workflow_dispatch:

# ============================================================
# WORKFLOW PERMISSIONS
# ============================================================

permissions:
  contents: read
  actions: read

# Prevent overlapping Render deployments.
concurrency:
  group: assistant-service-render-deployment
  cancel-in-progress: false

# ============================================================
# DEPLOYMENT JOB
# ============================================================

jobs:
  deploy:
    name: 🚀 Deploy Assistant Service
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Accepted deployment sources:
    # 1. Manual dispatch.
    # 2. Scheduled execution.
    # 3. A completed, successful CI workflow for a v* tag.
    #
    # Main-branch pushes, feature branches, pull requests,
    # failed CI runs, and non-version tags are deliberately skipped.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        startsWith(github.event.workflow_run.head_branch, 'v')
      )

    steps:
      # --------------------------------------------------------
      # STEP 1: VERIFY COMPLETE CI AND DOCKER RELEASE RESULTS
      # --------------------------------------------------------
      # workflow_run fires after the entire CI workflow completes.
      # Only a successful tag-push run reaches this step. Query
      # its jobs and independently require BOTH:
      #   - Assistant Service CI = success
      #   - Docker Build and Push = success
      #
      # A skipped Docker job (for ordinary main pushes) must never
      # be accepted as a release.
      - name: 🔎 Verify CI And Docker Release Jobs
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking completed CI workflow run: $CI_RUN_ID"

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100")

          CI_RESULT=$(printf '%s' "$RESPONSE" | jq -r '
            [.jobs[] | select(.name == "🧪 Assistant Service CI")][0].conclusion // "missing"
          ')

          DOCKER_RESULT=$(printf '%s' "$RESPONSE" | jq -r '
            [.jobs[] | select(.name == "🐳 Docker Build and Push")][0].conclusion // "missing"
          ')

          echo "CI validation result: $CI_RESULT"
          echo "Docker release result: $DOCKER_RESULT"

          if [ "$CI_RESULT" != "success" ]; then
            echo "❌ CI validation did not succeed. Deployment stopped."
            exit 1
          fi

          if [ "$DOCKER_RESULT" != "success" ]; then
            echo "❌ Docker Build and Push did not succeed."
            echo "A skipped or failed Docker job is not a published release."
            exit 1
          fi

          echo "✅ CI validation and Docker release both succeeded."

      # --------------------------------------------------------
      # STEP 2: CHECKOUT MAIN BRANCH
      # --------------------------------------------------------
      # Render's deploy hook is assumed to target main. Checkout
      # the branch that the Render service will actually deploy.
      - name: 📦 Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      # --------------------------------------------------------
      # STEP 3: DETECT AND VERIFY DEPLOYMENT METADATA
      # --------------------------------------------------------
      - name: 🏷️ Detect Deployment Metadata
        id: metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          echo "======================================"
          echo "🚀 ASSISTANT SERVICE DEPLOYMENT"
          echo "======================================"

          # Refresh the main reference and Git tags.
          git fetch --force origin main
          git fetch --force --tags

          MAIN_SHA=$(git rev-parse refs/remotes/origin/main)

          # ----------------------------------------------------
          # AUTOMATIC VERSION-TAG RELEASE DEPLOYMENT
          # ----------------------------------------------------
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            VERSION="$RELEASE_TAG"

            # Only version tags such as v1.0.0 are allowed.
            if [[ ! "$VERSION" =~ ^v[0-9] ]]; then
              echo "❌ Invalid release version tag: $VERSION"
              exit 1
            fi

            # Confirm the exact Git tag exists.
            if ! git rev-parse --verify "refs/tags/$VERSION^{commit}" >/dev/null 2>&1; then
              echo "❌ Version tag not found: $VERSION"
              exit 1
            fi

            TAG_SHA=$(git rev-parse "refs/tags/$VERSION^{commit}")

            # Make sure the tag references the same commit that
            # triggered the successful CI workflow.
            if [ "$TAG_SHA" != "$RELEASE_SHA" ]; then
              echo "❌ Tag commit differs from the CI run commit."
              echo "Tag commit: $TAG_SHA"
              echo "CI commit:  $RELEASE_SHA"
              exit 1
            fi

            # A Render deploy hook deploys the configured branch.
            # Do not claim to deploy a tag if main points elsewhere.
            if [ "$TAG_SHA" != "$MAIN_SHA" ]; then
              echo "❌ Release tag is not the current main branch HEAD."
              echo "Tagged commit: $TAG_SHA"
              echo "Main HEAD:     $MAIN_SHA"
              echo "Render deployment stopped to avoid deploying a different commit."
              exit 1
            fi

            COMMIT="$TAG_SHA"
            TRIGGER="Successful CI and Docker version-tag release"

          # ----------------------------------------------------
          # MANUAL OR SCHEDULED DEPLOYMENT
          # ----------------------------------------------------
          else
            COMMIT="$MAIN_SHA"
            VERSION="latest"

            # Use a version label only when a v* tag points to
            # exactly the same commit currently deployed from main.
            MATCHING_TAGS=$(git tag --points-at "$COMMIT" --list 'v*' --sort=-v:refname)

            if [ -n "$MATCHING_TAGS" ]; then
              VERSION=$(printf '%s\n' "$MATCHING_TAGS" | head -n 1)
            fi

            if [ "$EVENT_NAME" = "schedule" ]; then
              TRIGGER="Scheduled daily deployment"
            else
              TRIGGER="Manual deployment"
            fi
          fi

          BRANCH="main"
          SERVICE_URL="https://assistant-service-g24j.onrender.com/"
          DEPLOY_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          DEPLOY_TIME_IST=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')

          # Export deployment details for subsequent steps.
          {
            echo "VERSION=$VERSION"
            echo "COMMIT=$COMMIT"
            echo "BRANCH=$BRANCH"
            echo "SERVICE_URL=$SERVICE_URL"
            echo "DEPLOY_TIME_UTC=$DEPLOY_TIME_UTC"
            echo "DEPLOY_TIME_IST=$DEPLOY_TIME_IST"
            echo "DEPLOY_TRIGGER=$TRIGGER"
            echo "DEPLOY_STATUS=IN_PROGRESS"
          } >> "$GITHUB_ENV"

          echo "Service: $SERVICE_URL"
          echo "Version: $VERSION"
          echo "Commit: $COMMIT"
          echo "Branch: $BRANCH"
          echo "Trigger: $TRIGGER"
          echo "Docker image expected by Render: assistant-service:latest"
          echo "Triggered by: $ACTOR"
          echo "UTC: $DEPLOY_TIME_UTC"
          echo "IST: $DEPLOY_TIME_IST"
          echo "======================================"

      # --------------------------------------------------------
      # STEP 4: TRIGGER RENDER DEPLOYMENT
      # --------------------------------------------------------
      - name: 🚀 Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${RENDER_DEPLOY_HOOK:-}" ]; then
            echo "❌ RENDER_DEPLOY_HOOK secret is missing."
            exit 1
          fi

          echo "🚀 Triggering Assistant Service deployment..."

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/render_response.txt \
            --write-out "%{http_code}" \
            --request POST \
            --max-time 30 \
            "$RENDER_DEPLOY_HOOK")

          echo "Render HTTP status: $HTTP_STATUS"
          cat /tmp/render_response.txt || true

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "❌ Render deployment trigger failed."
            exit 1
          fi

          echo "✅ Render deployment trigger accepted."

      # --------------------------------------------------------
      # STEP 5: WAIT FOR APPLICATION STARTUP
      # --------------------------------------------------------
      - name: ⏳ Wait For Application Startup
        run: |
          echo "Waiting 30 seconds for Render startup..."
          sleep 30
          echo "Startup wait completed."

      # --------------------------------------------------------
      # STEP 6: VERIFY APPLICATION HEALTH
      # --------------------------------------------------------
      # Expected response: HTTP 200.
      # Attempts: 10; retry interval: 10 seconds.
      - name: ❤️ Assistant Service Health Check
        shell: bash
        run: |
          set -euo pipefail

          HEALTH_URL="https://assistant-service-g24j.onrender.com/"
          echo "Checking application: $HEALTH_URL"

          for i in {1..10}; do
            STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              --max-time 15 \
              "$HEALTH_URL" || true)

            echo "Health check $i/10: HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "DEPLOY_STATUS=SUCCESS" >> "$GITHUB_ENV"
              echo "🟢 Assistant Service is healthy."
              exit 0
            fi

            if [ "$i" -lt 10 ]; then
              sleep 10
            fi
          done

          echo "DEPLOY_STATUS=FAILED" >> "$GITHUB_ENV"
          echo "🔴 Assistant Service health check failed."
          exit 1

      # --------------------------------------------------------
      # STEP 7: FINAL DEPLOYMENT RESULT
      # --------------------------------------------------------
      # No email action is used here. Result details remain
      # visible in the GitHub Actions run summary and logs.
      - name: 🎉 Deployment Completed Successfully
        if: success()
        run: |
          echo "======================================"
          echo "🚀 ASSISTANT SERVICE DEPLOYMENT SUCCESS"
          echo "======================================"
          echo "Service: Assistant Service"
          echo "URL: $SERVICE_URL"
          echo "Version: $VERSION"
          echo "Commit: $COMMIT"
          echo "Branch: $BRANCH"
          echo "Trigger: $DEPLOY_TRIGGER"
          echo "Health: $DEPLOY_STATUS"
          echo "UTC: $DEPLOY_TIME_UTC"
          echo "IST: $DEPLOY_TIME_IST"
          echo "======================================"

      # --------------------------------------------------------
      # STEP 8: FINAL DEPLOYMENT FAILURE LOG
      # --------------------------------------------------------
      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "======================================"
          echo "🚨 ASSISTANT SERVICE DEPLOYMENT FAILED"
          echo "======================================"
          echo "Trigger: ${{ github.event_name }}"
          echo "Version: ${{ env.VERSION || 'not detected' }}"
          echo "Commit: ${{ env.COMMIT || github.sha }}"
          echo "Branch: ${{ env.BRANCH || 'main' }}"
          echo "Please inspect the failed step above."
          echo "======================================"
