# ============================================================
# 🚀 CD - ASSISTANT SERVICE RENDER
# ============================================================
#
# Repository:
# 9394113857/Assistant-Service
#
# Application:
# https://assistant-service-g24j.onrender.com/
#
# DEPLOYMENT STRATEGY
#
# 1. AUTOMATIC AFTER CI ON MAIN
#    - A push to main starts the CI workflow.
#    - CD waits until the complete CI workflow finishes.
#    - CD deploys only when CI concludes successfully.
#
# 2. AUTOMATIC AFTER CI ON A VERSION TAG
#    - Pushing a v* tag starts CI and its Docker release job.
#    - CD waits for the entire CI workflow, including Docker build
#      and Docker Hub push, to finish successfully.
#    - CD verifies the tag and its commit before deployment.
#
# 3. SCHEDULED DEPLOYMENT
#    - Daily at 2:00 AM IST (20:30 UTC on the previous day).
#    - Deploys the current main branch HEAD.
#
# 4. MANUAL DEPLOYMENT
#    - Run this workflow from GitHub Actions.
#    - Deploys the current main branch HEAD.
#
# VERSION DETECTION
#    - If a v* tag points to the exact main HEAD being deployed,
#      use that version label.
#    - Otherwise, use "latest" for the current main deployment.
#    - Render deploy hooks deploy the configured Render branch,
#      not an arbitrary Git tag. The workflow therefore checks
#      tag/commit alignment instead of claiming a false tag deploy.
#
# REQUIRED GITHUB SECRETS
#    RENDER_DEPLOY_HOOK
#    MAIL_USERNAME
#    MAIL_PASSWORD
#    MAIL_TO
#    MAIL_CC (optional)
#
# Docker secrets are used by CI, not by this CD workflow:
#    DOCKERHUB_USERNAME
#    DOCKERHUB_TOKEN
#
# ============================================================

name: 🚀 CD - Assistant Service Render

run-name: 🚀 Deploy Assistant Service | ${{ github.event_name }} | ${{ github.event.workflow_run.head_branch || github.ref_name }} | ${{ github.actor }}

# ============================================================
# WORKFLOW TRIGGERS
# ============================================================

on:
  # Start CD only after the complete CI workflow has completed.
  # The job condition below accepts successful main and v* runs.
  workflow_run:
    workflows:
      - "🚀 CI - Assistant Service"
    types:
      - completed

  # Daily deployment at 2:00 AM IST.
  # 2:00 AM IST = 20:30 UTC on the previous day.
  schedule:
    - cron: "30 20 * * *"

  # Manual deployment from the GitHub Actions tab.
  workflow_dispatch:

# ============================================================
# WORKFLOW PERMISSIONS
# ============================================================

permissions:
  contents: read

# Prevent overlapping Render deployments.
concurrency:
  group: assistant-service-render-deployment
  cancel-in-progress: false

# ============================================================
# DEPLOYMENT JOB
# ============================================================

jobs:
  deploy:
    name: 🚀 Deploy Assistant Service
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Run for:
    # 1. Manual deployment.
    # 2. Scheduled deployment.
    # 3. Successful CI run from main.
    # 4. Successful CI run from a version tag (v*).
    #
    # Skip failed CI runs, pull requests, feature branches,
    # and unrelated tag names.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        (
          github.event.workflow_run.head_branch == 'main' ||
          startsWith(github.event.workflow_run.head_branch, 'v')
        )
      )

    steps:
      # --------------------------------------------------------
      # STEP 1: CHECKOUT MAIN
      # --------------------------------------------------------
      # Render's deploy hook is assumed to target the main branch.
      # Always check out the latest main branch that Render will
      # deploy, rather than checking out a tag and misreporting it.
      - name: 📦 Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      # --------------------------------------------------------
      # STEP 2: DETECT DEPLOYMENT VERSION AND COMMIT
      # --------------------------------------------------------
      - name: 🏷️ Detect Deployment Metadata
        id: metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          echo "======================================"
          echo "🚀 ASSISTANT SERVICE DEPLOYMENT"
          echo "======================================"

          # Refresh main and all tags before version detection.
          git fetch --force origin main
          git fetch --force --tags

          MAIN_SHA=$(git rev-parse refs/remotes/origin/main)

          # ----------------------------------------------------
          # AUTOMATIC DEPLOYMENT AFTER CI
          # ----------------------------------------------------
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$CI_HEAD_BRANCH" = "main" ]; then
              # Main branch CI has succeeded. Deploy current main.
              # The current main HEAD may have advanced while CI ran,
              # so record the exact commit the Render hook will deploy.
              COMMIT="$MAIN_SHA"
              TRIGGER="Automatic after successful main CI"
              VERSION="latest"

              # If a version tag points exactly at current main HEAD,
              # show that tag as the deployment version.
              MATCHING_TAGS=$(git tag --points-at "$COMMIT" --list 'v*' --sort=-v:refname)
              if [ -n "$MATCHING_TAGS" ]; then
                VERSION=$(printf '%s\n' "$MATCHING_TAGS" | head -n 1)
              fi

            elif [[ "$CI_HEAD_BRANCH" =~ ^v[0-9] ]]; then
              # CI completed for a version tag. Verify the exact tag
              # commit matches the commit that triggered that CI run.
              VERSION="$CI_HEAD_BRANCH"

              if ! git rev-parse --verify "refs/tags/$VERSION^{commit}" >/dev/null 2>&1; then
                echo "❌ Version tag not found: $VERSION"
                exit 1
              fi

              TAG_SHA=$(git rev-parse "refs/tags/$VERSION^{commit}")

              if [ "$TAG_SHA" != "$CI_HEAD_SHA" ]; then
                echo "❌ Tag commit does not match the successful CI run."
                echo "Tag commit: $TAG_SHA"
                echo "CI commit:  $CI_HEAD_SHA"
                exit 1
              fi

              # A Render deploy hook deploys its configured branch.
              # Only deploy if this tag is exactly current main HEAD.
              if [ "$TAG_SHA" != "$MAIN_SHA" ]; then
                echo "❌ Tag is not the current main branch HEAD."
                echo "Tagged commit: $TAG_SHA"
                echo "Main HEAD:     $MAIN_SHA"
                echo "Deployment stopped to avoid deploying a different commit."
                exit 1
              fi

              COMMIT="$TAG_SHA"
              TRIGGER="Automatic after successful CI and Docker release"

            else
              echo "❌ Unsupported CI branch/tag: $CI_HEAD_BRANCH"
              exit 1
            fi

          # ----------------------------------------------------
          # MANUAL OR SCHEDULED DEPLOYMENT
          # ----------------------------------------------------
          else
            COMMIT="$MAIN_SHA"
            VERSION="latest"

            # Use the highest version tag that points to the exact
            # main HEAD. Do not label a main deployment with a tag
            # that refers to a different commit.
            MATCHING_TAGS=$(git tag --points-at "$COMMIT" --list 'v*' --sort=-v:refname)
            if [ -n "$MATCHING_TAGS" ]; then
              VERSION=$(printf '%s\n' "$MATCHING_TAGS" | head -n 1)
            fi

            if [ "$EVENT_NAME" = "schedule" ]; then
              TRIGGER="Scheduled daily deployment"
            else
              TRIGGER="Manual deployment"
            fi
          fi

          BRANCH="main"
          SERVICE_URL="https://assistant-service-g24j.onrender.com/"
          DEPLOY_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          DEPLOY_TIME_IST=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')

          # Export values for later steps and email notifications.
          {
            echo "VERSION=$VERSION"
            echo "COMMIT=$COMMIT"
            echo "BRANCH=$BRANCH"
            echo "SERVICE_URL=$SERVICE_URL"
            echo "DEPLOY_TIME_UTC=$DEPLOY_TIME_UTC"
            echo "DEPLOY_TIME_IST=$DEPLOY_TIME_IST"
            echo "DEPLOY_STATUS=IN_PROGRESS"
            echo "DEPLOY_TRIGGER=$TRIGGER"
          } >> "$GITHUB_ENV"

          {
            echo "version=$VERSION"
            echo "commit=$COMMIT"
          } >> "$GITHUB_OUTPUT"

          echo "Service: $SERVICE_URL"
          echo "Version: $VERSION"
          echo "Commit: $COMMIT"
          echo "Branch: $BRANCH"
          echo "Trigger: $TRIGGER"
          echo "Triggered by: $ACTOR"
          echo "UTC: $DEPLOY_TIME_UTC"
          echo "IST: $DEPLOY_TIME_IST"
          echo "======================================"

      # --------------------------------------------------------
      # STEP 3: TRIGGER RENDER DEPLOYMENT
      # --------------------------------------------------------
      - name: 🚀 Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${RENDER_DEPLOY_HOOK:-}" ]; then
            echo "❌ RENDER_DEPLOY_HOOK secret is missing."
            exit 1
          fi

          echo "🚀 Triggering Render deployment..."

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/render_response.txt \
            --write-out "%{http_code}" \
            --request POST \
            --max-time 30 \
            "$RENDER_DEPLOY_HOOK")

          echo "Render HTTP status: $HTTP_STATUS"
          cat /tmp/render_response.txt || true

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "❌ Render deployment trigger failed."
            exit 1
          fi

          echo "✅ Render deployment trigger accepted."

      # --------------------------------------------------------
      # STEP 4: WAIT FOR APPLICATION STARTUP
      # --------------------------------------------------------
      - name: ⏳ Wait For Application Startup
        run: |
          echo "Waiting 30 seconds for Render startup..."
          sleep 30
          echo "Startup wait completed."

      # --------------------------------------------------------
      # STEP 5: APPLICATION HEALTH CHECK
      # --------------------------------------------------------
      # Expected response: HTTP 200
      # Attempts: 10
      # Interval: 10 seconds
      # Maximum wait after startup: approximately 100 seconds.
      - name: ❤️ Assistant Service Health Check
        shell: bash
        run: |
          set -euo pipefail

          HEALTH_URL="https://assistant-service-g24j.onrender.com/"
          echo "Checking: $HEALTH_URL"

          for i in {1..10}; do
            STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              --max-time 15 \
              "$HEALTH_URL" || true)

            echo "Health check $i/10: HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "DEPLOY_STATUS=SUCCESS" >> "$GITHUB_ENV"
              echo "🟢 Assistant Service is healthy."
              exit 0
            fi

            if [ "$i" -lt 10 ]; then
              sleep 10
            fi
          done

          echo "DEPLOY_STATUS=FAILED" >> "$GITHUB_ENV"
          echo "🔴 Assistant Service health check failed."
          exit 1

      # --------------------------------------------------------
      # STEP 6: DEPLOYMENT SUCCESS EMAIL
      # --------------------------------------------------------
      - name: 📧 Deployment Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚀 CD SUCCESS | Assistant Service ${{ env.VERSION }}"
          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}
          from: Assistant Service <${{ secrets.MAIL_USERNAME }}>
          body: |
            🚀 ASSISTANT SERVICE DEPLOYMENT SUCCESS

            Application URL:
            ${{ env.SERVICE_URL }}

            Version:
            ${{ env.VERSION }}

            Commit:
            ${{ env.COMMIT }}

            Branch:
            ${{ env.BRANCH }}

            Trigger:
            ${{ env.DEPLOY_TRIGGER }}

            Triggered By:
            ${{ github.actor }}

            Deployment Time UTC:
            ${{ env.DEPLOY_TIME_UTC }}

            Deployment Time IST:
            ${{ env.DEPLOY_TIME_IST }}

            Health Status:
            ${{ env.DEPLOY_STATUS }}

            Deployment Result:
            SUCCESSFUL

            GitHub Repository:
            ${{ github.repository }}

            GitHub Actions Run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # --------------------------------------------------------
      # STEP 7: DEPLOYMENT FAILURE EMAIL
      # --------------------------------------------------------
      - name: ❌ Deployment Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚨 CD FAILED | Assistant Service"
          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}
          from: Assistant Service <${{ secrets.MAIL_USERNAME }}>
          body: |
            🚨 ASSISTANT SERVICE DEPLOYMENT FAILED

            Application URL:
            https://assistant-service-g24j.onrender.com/

            Version:
            ${{ env.VERSION || 'UNKNOWN' }}

            Commit:
            ${{ env.COMMIT || github.sha }}

            Branch:
            ${{ env.BRANCH || 'main' }}

            Trigger:
            ${{ github.event_name }}

            Triggered By:
            ${{ github.actor }}

            Deployment Time UTC:
            ${{ env.DEPLOY_TIME_UTC || 'Metadata unavailable' }}

            Deployment Time IST:
            ${{ env.DEPLOY_TIME_IST || 'Metadata unavailable' }}

            Deployment Result:
            FAILED

            Please check:
            1. GitHub Actions logs
            2. Render deployment logs
            3. Render service status
            4. Application health check
            5. Version tag and main commit alignment, if tag-triggered

            GitHub Actions Run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # --------------------------------------------------------
      # STEP 8: FINAL DEPLOYMENT SUCCESS LOG
      # --------------------------------------------------------
      - name: 🎉 Deployment Completed Successfully
        if: success()
        run: |
          echo "======================================"
          echo "🚀 ASSISTANT SERVICE DEPLOYMENT SUCCESS"
          echo "======================================"
          echo "Service: Assistant Service"
          echo "URL: $SERVICE_URL"
          echo "Version: $VERSION"
          echo "Commit: $COMMIT"
          echo "Branch: $BRANCH"
          echo "Trigger: $DEPLOY_TRIGGER"
          echo "Health: $DEPLOY_STATUS"
          echo "UTC: $DEPLOY_TIME_UTC"
          echo "IST: $DEPLOY_TIME_IST"
          echo "======================================"
