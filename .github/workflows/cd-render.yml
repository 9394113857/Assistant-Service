# ============================================================
# 🚀 CD - ASSISTANT SERVICE RENDER
# ============================================================
#
# Repository:
# 9394113857/Assistant-Service
#
# APPLICATION:
# https://assistant-service-g24j.onrender.com/
#
# DEPLOYMENT TRIGGERS:
#
# 1. Automatic: after the complete CI workflow succeeds for a
#    version tag (v*). This waits for CI, including the Docker
#    build and Docker Hub push job, to finish successfully.
#
# 2. Manual: deploy the latest commit from main.
#
# IMPORTANT:
# Render deploy hooks deploy the latest commit from the branch
# configured in the Render service. Therefore, automatic release
# deployment proceeds only when the version tag points to the
# current main branch HEAD. This prevents deploying a different
# commit while reporting the tag as the deployed version.
#
# REQUIRED GITHUB SECRETS:
# RENDER_DEPLOY_HOOK
# MAIL_USERNAME
# MAIL_PASSWORD
# MAIL_TO
# MAIL_CC (optional)
#
# ============================================================

name: 🚀 CD - Assistant Service Render

run-name: 🚀 Deploy Assistant Service | ${{ github.event_name }} | ${{ github.event.workflow_run.head_branch || github.ref_name }} | ${{ github.actor }}

# ============================================================
# WORKFLOW TRIGGERS
# ============================================================

on:
  # Run only after the CI workflow has completed.
  # The deploy job below accepts successful version-tag runs only.
  workflow_run:
    workflows:
      - "🚀 CI - Assistant Service"
    types:
      - completed

  # Allow a manual deployment from the Actions tab.
  workflow_dispatch:

# ============================================================
# WORKFLOW PERMISSIONS
# ============================================================

permissions:
  contents: read

# Avoid two deployments running at the same time.
concurrency:
  group: assistant-service-render-deployment
  cancel-in-progress: false

# ============================================================
# DEPLOYMENT JOB
# ============================================================

jobs:
  deploy:
    name: 🚀 Deploy Assistant Service

    # Automatic deployments are accepted only for successful
    # CI runs whose head branch/ref is a version tag (v*).
    # Manual runs always deploy the latest main branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'v')
      )

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # --------------------------------------------------------
      # STEP 1: CHECKOUT MAIN
      # --------------------------------------------------------
      # Render's deploy hook deploys the branch configured in
      # Render. This workflow therefore verifies the tag against
      # main before triggering the hook.
      - name: 📦 Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      # --------------------------------------------------------
      # STEP 2: DETECT AND VERIFY DEPLOYMENT VERSION
      # --------------------------------------------------------
      - name: 🏷️ Detect Deployment Metadata
        id: metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          echo "======================================"
          echo "🚀 ASSISTANT SERVICE DEPLOYMENT"
          echo "======================================"

          git fetch --force origin main
          git fetch --force --tags

          MAIN_SHA=$(git rev-parse refs/remotes/origin/main)

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            VERSION="$RELEASE_TAG"

            if [[ ! "$VERSION" =~ ^v[0-9] ]]; then
              echo "❌ Expected a version tag beginning with v: $VERSION"
              exit 1
            fi

            if ! git rev-parse --verify "refs/tags/$VERSION^{commit}" >/dev/null 2>&1; then
              echo "❌ Version tag not found: $VERSION"
              exit 1
            fi

            TAG_SHA=$(git rev-parse "refs/tags/$VERSION^{commit}")

            if [ "$TAG_SHA" != "$RELEASE_SHA" ]; then
              echo "❌ Tag commit does not match the successful CI run commit."
              echo "Tag commit: $TAG_SHA"
              echo "CI commit:  $RELEASE_SHA"
              exit 1
            fi

            if [ "$TAG_SHA" != "$MAIN_SHA" ]; then
              echo "❌ Safety check failed: the tagged commit is not current main HEAD."
              echo "Tagged commit: $TAG_SHA"
              echo "Main HEAD:     $MAIN_SHA"
              echo "Render deploy hook targets the configured branch, so deployment was stopped."
              exit 1
            fi

            COMMIT="$TAG_SHA"
            BRANCH="main"
            TRIGGER="Successful CI version-tag run"
          else
            VERSION="manual-main"
            COMMIT="$MAIN_SHA"
            BRANCH="main"
            TRIGGER="Manual deployment"
          fi

          SERVICE_URL="https://assistant-service-g24j.onrender.com/"
          DEPLOY_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          DEPLOY_TIME_IST=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')

          {
            echo "VERSION=$VERSION"
            echo "COMMIT=$COMMIT"
            echo "BRANCH=$BRANCH"
            echo "SERVICE_URL=$SERVICE_URL"
            echo "DEPLOY_TIME_UTC=$DEPLOY_TIME_UTC"
            echo "DEPLOY_TIME_IST=$DEPLOY_TIME_IST"
            echo "DEPLOY_STATUS=IN_PROGRESS"
            echo "DEPLOY_TRIGGER=$TRIGGER"
          } >> "$GITHUB_ENV"

          {
            echo "version=$VERSION"
            echo "commit=$COMMIT"
          } >> "$GITHUB_OUTPUT"

          echo "Service: $SERVICE_URL"
          echo "Version: $VERSION"
          echo "Commit: $COMMIT"
          echo "Branch: $BRANCH"
          echo "Trigger: $TRIGGER"
          echo "Triggered by: $ACTOR"
          echo "UTC: $DEPLOY_TIME_UTC"
          echo "IST: $DEPLOY_TIME_IST"
          echo "======================================"

      # --------------------------------------------------------
      # STEP 3: TRIGGER RENDER DEPLOYMENT
      # --------------------------------------------------------
      - name: 🚀 Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${RENDER_DEPLOY_HOOK:-}" ]; then
            echo "❌ RENDER_DEPLOY_HOOK secret is missing."
            exit 1
          fi

          echo "🚀 Triggering Render deployment..."

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/render_response.txt \
            --write-out "%{http_code}" \
            --request POST \
            --max-time 30 \
            "$RENDER_DEPLOY_HOOK")

          echo "Render HTTP status: $HTTP_STATUS"
          cat /tmp/render_response.txt || true

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "❌ Render deployment trigger failed."
            exit 1
          fi

          echo "✅ Render deployment trigger accepted."

      # --------------------------------------------------------
      # STEP 4: WAIT FOR APPLICATION STARTUP
      # --------------------------------------------------------
      - name: ⏳ Wait For Application Startup
        run: |
          echo "Waiting 30 seconds for Render startup..."
          sleep 30
          echo "Startup wait completed."

      # --------------------------------------------------------
      # STEP 5: APPLICATION HEALTH CHECK
      # --------------------------------------------------------
      # Expected response: HTTP 200
      # Attempts: 10
      # Interval: 10 seconds
      - name: ❤️ Assistant Service Health Check
        shell: bash
        run: |
          set -euo pipefail

          HEALTH_URL="https://assistant-service-g24j.onrender.com/"
          echo "Checking: $HEALTH_URL"

          for i in {1..10}; do
            STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              --max-time 15 \
              "$HEALTH_URL" || true)

            echo "Health check $i/10: HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "DEPLOY_STATUS=SUCCESS" >> "$GITHUB_ENV"
              echo "🟢 Assistant Service is healthy."
              exit 0
            fi

            if [ "$i" -lt 10 ]; then
              sleep 10
            fi
          done

          echo "DEPLOY_STATUS=FAILED" >> "$GITHUB_ENV"
          echo "🔴 Assistant Service health check failed."
          exit 1

      # --------------------------------------------------------
      # STEP 6: DEPLOYMENT SUCCESS EMAIL
      # --------------------------------------------------------
      - name: 📧 Deployment Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚀 CD SUCCESS | Assistant Service ${{ env.VERSION }}"
          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}
          from: Assistant Service <${{ secrets.MAIL_USERNAME }}>
          body: |
            🚀 ASSISTANT SERVICE DEPLOYMENT SUCCESS

            Service:
            Assistant Service

            Application URL:
            ${{ env.SERVICE_URL }}

            Version:
            ${{ env.VERSION }}

            Commit:
            ${{ env.COMMIT }}

            Branch:
            ${{ env.BRANCH }}

            Trigger:
            ${{ env.DEPLOY_TRIGGER }}

            Triggered By:
            ${{ github.actor }}

            Deployment Time UTC:
            ${{ env.DEPLOY_TIME_UTC }}

            Deployment Time IST:
            ${{ env.DEPLOY_TIME_IST }}

            Health Status:
            ${{ env.DEPLOY_STATUS }}

            Deployment Result:
            SUCCESSFUL

            GitHub Actions Run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # --------------------------------------------------------
      # STEP 7: DEPLOYMENT FAILURE EMAIL
      # --------------------------------------------------------
      - name: ❌ Deployment Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚨 CD FAILED | Assistant Service"
          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}
          from: Assistant Service <${{ secrets.MAIL_USERNAME }}>
          body: |
            🚨 ASSISTANT SERVICE DEPLOYMENT FAILED

            Application URL:
            https://assistant-service-g24j.onrender.com/

            Version:
            ${{ env.VERSION || 'UNKNOWN' }}

            Commit:
            ${{ env.COMMIT || github.sha }}

            Branch:
            ${{ env.BRANCH || 'main' }}

            Trigger:
            ${{ github.event_name }}

            Triggered By:
            ${{ github.actor }}

            Deployment Time UTC:
            ${{ env.DEPLOY_TIME_UTC || 'Metadata unavailable' }}

            Deployment Time IST:
            ${{ env.DEPLOY_TIME_IST || 'Metadata unavailable' }}

            Deployment Result:
            FAILED

            Please check:
            1. GitHub Actions logs
            2. Render deployment logs
            3. Render service status
            4. Application health endpoint
            5. Version tag and main branch commit, if release-triggered

            GitHub Actions Run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # --------------------------------------------------------
      # STEP 8: FINAL DEPLOYMENT SUCCESS LOG
      # --------------------------------------------------------
      - name: 🎉 Deployment Completed Successfully
        if: success()
        run: |
          echo "======================================"
          echo "🚀 ASSISTANT SERVICE DEPLOYMENT SUCCESS"
          echo "======================================"
          echo "Service: Assistant Service"
          echo "URL: $SERVICE_URL"
          echo "Version: $VERSION"
          echo "Commit: $COMMIT"
          echo "Branch: $BRANCH"
          echo "Trigger: $DEPLOY_TRIGGER"
          echo "Health: $DEPLOY_STATUS"
          echo "UTC: $DEPLOY_TIME_UTC"
          echo "IST: $DEPLOY_TIME_IST"
          echo "======================================"
