name: "🗄️ Manual - Assistant-Service Supabase Diagnostics"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant-service-supabase-diagnostics
  cancel-in-progress: false

jobs:
  database-diagnostics:
    name: "Read-only Supabase Database Report"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Kolkata

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "📦 Install PostgreSQL Driver"
        run: |
          python -m pip install --upgrade pip
          python -m pip install "psycopg==3.3.9" "psycopg-binary==3.3.9"

      - name: "🔐 Validate Database Configuration"
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is missing."
            echo "Add the Assistant-Service Supabase connection string as a GitHub Actions secret named DATABASE_URL."
            exit 1
          fi

          echo "DATABASE_URL secret is present."
          echo "Connection string value will not be printed."

      - name: "🔍 Run Read-only Supabase Diagnostics"
        run: |
          python - <<'PY'
          import os
          import sys
          from urllib.parse import urlsplit, unquote

          import psycopg
          from psycopg import sql

          database_url = os.environ.get("DATABASE_URL", "").strip()
          if not database_url:
              print("DIAGNOSTIC_STATUS=FAILED")
              sys.exit("DATABASE_URL is missing.")

          parsed = urlsplit(database_url)
          host = parsed.hostname or "not-parsed"
          database_name = unquote(parsed.path.lstrip("/")) or "not-parsed"

          print("=" * 72)
          print("🚀 ASSISTANT-SERVICE SUPABASE DATABASE DIAGNOSTICS")
          print("=" * 72)
          print(f"Execution timezone : {os.environ.get('TZ', 'UTC')}")
          print(f"Database host      : {host}")
          print(f"Database name      : {database_name}")
          print("Connection secret  : PRESENT (value hidden)")
          print("Access mode        : READ ONLY")
          print("-" * 72)

          expected_tables = [
              "chat_sessions",
              "chat_messages",
              "assistant_training_logs",
              "alembic_version",
          ]

          try:
              with psycopg.connect(database_url, connect_timeout=15) as connection:
                  with connection.cursor() as cursor:
                      # Enforce a read-only transaction before running diagnostics.
                      cursor.execute("SET TRANSACTION READ ONLY")

                      cursor.execute("SELECT current_database(), current_schema(), current_user")
                      current_database, current_schema, current_user = cursor.fetchone()
                      print("✅ Supabase connection successful.")
                      print(f"Current database   : {current_database}")
                      print(f"Current schema     : {current_schema}")
                      print(f"Database role      : {current_user}")

                      cursor.execute("SHOW server_version")
                      print(f"PostgreSQL version : {cursor.fetchone()[0]}")

                      cursor.execute("""
                          SELECT table_name
                          FROM information_schema.tables
                          WHERE table_schema = 'public'
                            AND table_type = 'BASE TABLE'
                          ORDER BY table_name
                      """)
                      tables = [row[0] for row in cursor.fetchall()]
                      table_set = set(tables)

                      print("\n📚 PUBLIC SCHEMA TABLES")
                      print("-" * 72)
                      print(f"Total public tables : {len(tables)}")
                      for table in tables:
                          print(f"  • {table}")

                      print("\n🧩 ASSISTANT-SERVICE TABLE CHECK")
                      print("-" * 72)
                      missing_tables = []
                      for table in expected_tables:
                          if table not in table_set:
                              print(f"⚠️ {table}: NOT FOUND")
                              if table != "alembic_version":
                                  missing_tables.append(table)
                              continue

                          cursor.execute(
                              sql.SQL("SELECT COUNT(*) FROM {}.{}").format(
                                  sql.Identifier("public"),
                                  sql.Identifier(table),
                              )
                          )
                          row_count = cursor.fetchone()[0]
                          print(f"✅ {table}: EXISTS | ROW_COUNT={row_count}")

                          cursor.execute("""
                              SELECT column_name, data_type, is_nullable
                              FROM information_schema.columns
                              WHERE table_schema = 'public' AND table_name = %s
                              ORDER BY ordinal_position
                          """, (table,))
                          columns = cursor.fetchall()
                          print("   Columns:")
                          for column_name, data_type, nullable in columns:
                              print(f"     - {column_name} ({data_type}, nullable={nullable})")

                          if table == "assistant_training_logs":
                              column_names = {column[0] for column in columns}
                              if "predicted_intent" in column_names:
                                  cursor.execute("""
                                      SELECT predicted_intent, COUNT(*)
                                      FROM public.assistant_training_logs
                                      GROUP BY predicted_intent
                                      ORDER BY COUNT(*) DESC, predicted_intent
                                  """)
                                  print("   Predicted intent distribution:")
                                  for intent, count in cursor.fetchall():
                                      print(f"     - {intent}: {count}")

                              if "actual_intent" in column_names:
                                  cursor.execute("""
                                      SELECT COUNT(*) FILTER (WHERE actual_intent IS NOT NULL),
                                             COUNT(*) FILTER (WHERE actual_intent IS NULL)
                                      FROM public.assistant_training_logs
                                  """)
                                  reviewed_labels, pending_labels = cursor.fetchone()
                                  print(f"   Rows with actual_intent : {reviewed_labels}")
                                  print(f"   Rows without actual_intent: {pending_labels}")

                              if {"reviewer_user_id", "reviewed_at"}.issubset(column_names):
                                  cursor.execute("""
                                      SELECT COUNT(*)
                                      FROM public.assistant_training_logs
                                      WHERE reviewer_user_id IS NOT NULL
                                        AND reviewed_at IS NOT NULL
                                  """)
                                  audited_count = cursor.fetchone()[0]
                                  print(f"   Human-audited rows      : {audited_count}")

                      print("\n🧾 DATABASE MIGRATION CHECK")
                      print("-" * 72)
                      if "alembic_version" in table_set:
                          cursor.execute("SELECT version_num FROM public.alembic_version")
                          revisions = [row[0] for row in cursor.fetchall()]
                          print(f"Applied Alembic revisions: {', '.join(revisions) if revisions else 'NONE'}")
                      else:
                          print("⚠️ alembic_version table not found; migration state cannot be reported.")

                      print("\n" + "=" * 72)
                      print("DIAGNOSTIC_STATUS=SUCCESS")
                      print(f"PUBLIC_TABLE_COUNT={len(tables)}")
                      print(f"MISSING_EXPECTED_TABLES={len(missing_tables)}")
                      print("DATABASE_ACCESS=READ_ONLY")
                      print("No INSERT, UPDATE, DELETE, DDL, or migration commands were executed.")
                      print("=" * 72)

          except Exception as error:
              # Avoid printing connection strings or exception details that may contain credentials.
              print("\n" + "=" * 72)
              print("DIAGNOSTIC_STATUS=FAILED")
              print(f"ERROR_TYPE={type(error).__name__}")
              print("The database diagnostic could not complete. Review secret format, network access, and Supabase availability.")
              print("=" * 72)
              sys.exit(1)
          PY

      - name: "📋 Diagnostics Summary"
        if: always()
        run: |
          echo "Assistant-Service Supabase diagnostics workflow finished."
          echo "Review the 'Run Read-only Supabase Diagnostics' step for the full report."
          echo "This workflow is read-only and does not apply database migrations."
